# The whole GM.FileStorage sample: PostgreSQL, Redis, the files API, two workers and the gateway.
#
#   docker compose up -d --build        # everything; the gateway (Swagger UI at /) is on http://localhost:8080
#   docker compose up -d postgres       # just the database, to run the projects with `dotnet run`
#
# Only the gateway is published, as in production: the API is reached through it. Inside the network the services
# talk plain HTTP on port 8080. The API applies its migrations on startup; the workers retry their job every minute,
# so they cope with starting before the schema exists.
#
# Redis makes the stack safe to scale out: the gateway's rate-limit counts, the API's per-client file count and the
# workers' job lock all live there, shared by every instance. Two workers run to show it: only one cleans at a time.
# Without Redis:ConnectionString (as with `dotnet run`) each service keeps them in memory, which suits one instance.
#
# Settings that live in appsecrets.json for `dotnet run` (the connection string, the link-signing key) come from
# environment variables here, which GM.Secrets layers over appsettings.json the same way. They're the demo values
# below; use your own anywhere real.
#
# For `dotnet run` instead, give the API and the worker their connection string in appsecrets.json (gitignored),
# from the committed templates:
#
#   cp GM.FileStorage.Sample.API/appsecrets.example.json GM.FileStorage.Sample.API/appsecrets.json
#   cp GM.FileStorage.Sample.Worker/appsecrets.example.json GM.FileStorage.Sample.Worker/appsecrets.json

x-app-environment: &app-environment
  ConnectionStrings__ApplicationDatabase: "Host=postgres;Port=5432;Database=GMFileStorageSample;Username=postgres;Password=123456"
  Redis__ConnectionString: redis:6379
  # The storage root the API and the workers share (the file-storage volume).
  FileStorage__Local__RootPath: /data/file-storage

services:
  postgres:
    image: postgres:16-alpine
    container_name: gm-filestorage-postgres
    environment:
      POSTGRES_DB: GMFileStorageSample
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    volumes:
      - gm-filestorage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d GMFileStorageSample"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gm-filestorage-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        PROJECT: GM.FileStorage.Sample.API
    container_name: gm-filestorage-api
    environment:
      <<: *app-environment
      ASPNETCORE_ENVIRONMENT: Development
      # Presigned links on local disk point at the gateway, signed with this demo key
      # (the one in appsecrets.example.json).
      FileStorage__Local__PublicBaseUrl: http://localhost:8080/files
      FileStorage__Local__SigningKey: "qPNCcLDn8ZXoh6z8LE9rPGYNWRMaHDSWDevspFMUGewh"
    volumes:
      - gm-filestorage-files:/data/file-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        PROJECT: GM.FileStorage.Sample.Worker
    # No container_name, so it can run as several replicas.
    deploy:
      replicas: 2
    environment:
      <<: *app-environment
      DOTNET_ENVIRONMENT: Development
    volumes:
      - gm-filestorage-files:/data/file-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  gateway:
    build:
      context: .
      args:
        PROJECT: GM.FileStorage.Sample.Gateway.API
    container_name: gm-filestorage-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Redis__ConnectionString: redis:6379
      ReverseProxy__Clusters__files-api__Destinations__primary__Address: http://api:8080/
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  gm-filestorage-pgdata:
  gm-filestorage-files:
