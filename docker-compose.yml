# PostgreSQL for the GM.FileStorage sample's catalog (the stored-file + metadata tables).
#
#   docker compose up -d
#
# Then give the API its connection string in appsecrets.json (gitignored), from the committed template:
#
#   cp GM.FileStorage.Sample.API/appsecrets.example.json GM.FileStorage.Sample.API/appsecrets.json
#
# The API applies its migrations on startup, so the schema is created on first run.
services:
  postgres:
    image: postgres:16-alpine
    container_name: gm-filestorage-postgres
    environment:
      POSTGRES_DB: GMFileStorageSample
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    volumes:
      - gm-filestorage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d GMFileStorageSample"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gm-filestorage-pgdata:
