name: ci

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # A real PostgreSQL so the end-to-end (WAF) tests actually run instead of no-opping. The connection
    # string lives in appsecrets.json (gitignored), which the job creates from the committed template.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: GMFileStorageSample
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d GMFileStorageSample"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Create appsecrets.json (connection string for the postgres service)
        run: cp GM.FileStorage.Sample.API/appsecrets.example.json GM.FileStorage.Sample.API/appsecrets.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  # The whole sample as docker-compose.yml runs it — images built from the Dockerfile — exercised through the gateway.
  compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and start PostgreSQL, the API, the worker and the gateway
        run: docker compose up -d --build

      - name: Wait until the gateway is ready (its readiness probes the API)
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health/ready >/dev/null && exit 0
            sleep 2
          done
          exit 1

      - name: Upload, list and download through the gateway
        env:
          T: "X-Tenant-Id: 0c1f6a52-3b8e-4d7a-9f20-6e5b1c4d8a01"
          U: "X-User-Id: 5b0d9e2a-7c41-4f6e-8a3b-2d9c1e7f0a64"
        run: |
          printf '%%PDF-1.7 compose smoke test' > smoke.pdf
          id=$(curl -sf -H "$U" -H "$T" -F "file=@smoke.pdf;type=application/pdf" "http://localhost:8080/api/v1/files" | jq -r .id)
          echo "uploaded $id"
          curl -sf -H "$U" -H "$T" "http://localhost:8080/api/v1/files" | jq -e --arg id "$id" 'map(.id) == [$id]'
          curl -sf -H "$U" -H "$T" -o back.pdf "http://localhost:8080/api/v1/files/$id/content"
          cmp smoke.pdf back.pdf
          # The download is in the file's history, as the user the client named (X-User-Id).
          curl -sf -H "$U" -H "$T" "http://localhost:8080/api/v1/files/$id/history" \
            | jq -e 'map(.action) == ["Downloaded", "Uploaded"] and all(.userId == "5b0d9e2a-7c41-4f6e-8a3b-2d9c1e7f0a64")'
          # Another tenant can't see it.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$U" -H "X-Tenant-Id: $(cat /proc/sys/kernel/random/uuid)" "http://localhost:8080/api/v1/files/$id/content")" = 404
          curl -sf http://localhost:8080/swagger/v1/swagger.json | jq -e '.paths | has("/api/v1/files/batch")'

      - name: The API and the workers share the storage volume and Redis
        run: |
          docker compose exec -T api find /data/file-storage -type f ! -name '*.gmmeta' | grep -q .
          docker compose exec -T --index 2 worker find /data/file-storage -type f ! -name '*.gmmeta' | grep -q .
          # Storage gives nothing away: no extensions, nothing naming the uploaded file, no plaintext PDF.
          ! docker compose exec -T api find /data/file-storage -name '*.pdf' | grep -q .
          ! docker compose exec -T api grep -rlq -e 'smoke.pdf' -e '%PDF' /data/file-storage
          # Both workers scheduled the job; the lock they share (and the rate-limit counts) live in Redis.
          test "$(docker compose ps -q worker | wc -l)" = 2
          test "$(docker compose logs worker | grep -c "Scheduled job 'storage-cleanup'")" -ge 2
          docker compose exec -T redis redis-cli --scan | tee redis-keys.txt
          grep -qi "ratelimit" redis-keys.txt

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v

  compose-scanning:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack with malware scanning (ClamAV)
        run: docker compose -f docker-compose.yml -f docker-compose.scanning.yml up -d --build

      - name: Wait until the gateway is ready (ClamAV loads its signatures first)
        run: |
          for i in $(seq 1 120); do
            curl -sf http://localhost:8080/health/ready >/dev/null && exit 0
            sleep 3
          done
          exit 1

      - name: A clean upload is stored, an infected one refused and not kept
        env:
          T: "X-Tenant-Id: 2b7e5c41-9d3a-4f08-b6e2-7c1a0d9f3e58"
        run: |
          printf '%%PDF-1.7 a clean document' > clean.pdf
          curl -sf -H "$T" -F "file=@clean.pdf;type=application/pdf" "http://localhost:8080/api/v1/files" | jq -e .id
          # The EICAR test file: harmless, and reported by every scanner. Stored reversed here, assembled at run time, and
          # zipped: a .docx is a ZIP, so it passes the type checks, and ClamAV looks inside archives.
          printf '%s' '*H+H$!ELIF-TSET-SURIVITNA-DRADNATS-RACIE$}7)CC7)^P(45XZP\4[PA@%P!O5X' | rev > eicar.com
          python3 -m zipfile -c eicar.docx eicar.com
          code=$(curl -s -o refused.json -w '%{http_code}' -H "$T" \
            -F "file=@eicar.docx;type=application/vnd.openxmlformats-officedocument.wordprocessingml.document" \
            "http://localhost:8080/api/v1/files")
          cat refused.json
          test "$code" = 400
          grep -qi "malware" refused.json
          curl -sf -H "$T" "http://localhost:8080/api/v1/files" | jq -e 'length == 1'
          ! docker compose exec -T api grep -rlq 'EICAR' /data/file-storage

      - name: Logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.scanning.yml logs

      - name: Stop
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.scanning.yml down -v
