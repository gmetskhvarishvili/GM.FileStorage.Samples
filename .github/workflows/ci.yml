name: ci

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # A real PostgreSQL so the end-to-end (WAF) tests actually run instead of no-opping. The connection
    # string lives in appsecrets.json (gitignored), which the job creates from the committed template.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: GMFileStorageSample
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d GMFileStorageSample"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Create appsecrets.json (connection string for the postgres service)
        run: cp GM.FileStorage.Sample.API/appsecrets.example.json GM.FileStorage.Sample.API/appsecrets.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  # The whole sample as docker-compose.yml runs it — images built from the Dockerfile — exercised through the gateway.
  compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and start PostgreSQL, the API, the worker and the gateway
        run: docker compose up -d --build

      - name: Wait until the gateway is ready (its readiness probes the API)
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health/ready >/dev/null && exit 0
            sleep 2
          done
          exit 1

      - name: Upload, list and download through the gateway
        env:
          T: "X-Tenant-Id: 0c1f6a52-3b8e-4d7a-9f20-6e5b1c4d8a01"
        run: |
          printf '%%PDF-1.7 compose smoke test' > smoke.pdf
          id=$(curl -sf -H "$T" -F "file=@smoke.pdf;type=application/pdf" "http://localhost:8080/api/v1/files" | jq -r .id)
          echo "uploaded $id"
          curl -sf -H "$T" "http://localhost:8080/api/v1/files" | jq -e --arg id "$id" 'map(.id) == [$id]'
          curl -sf -H "$T" -o back.pdf "http://localhost:8080/api/v1/files/$id/content"
          cmp smoke.pdf back.pdf
          # Another tenant can't see it.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-Tenant-Id: $(cat /proc/sys/kernel/random/uuid)" "http://localhost:8080/api/v1/files/$id/content")" = 404
          curl -sf http://localhost:8080/swagger/v1/swagger.json | jq -e '.paths | has("/api/v1/files/batch")'

      - name: Presigned link through the gateway
        env:
          T: "X-Tenant-Id: 0c1f6a52-3b8e-4d7a-9f20-6e5b1c4d8a01"
        run: |
          id=$(curl -sf -H "$T" "http://localhost:8080/api/v1/files" | jq -r '.[0].id')
          link=$(curl -sf -H "$T" "http://localhost:8080/api/v1/files/$id/presign" | jq -r .url)
          echo "link $link"
          curl -sf -o linked.pdf "$link"
          cmp smoke.pdf linked.pdf
          test "$(curl -s -o /dev/null -w '%{http_code}' "${link%%&sig=*}")" = 403

      - name: Direct upload through the gateway
        env:
          T: "X-Tenant-Id: 7d3e2b90-1a4c-4f6e-8b5d-0c9a7e1f3b42"
        run: |
          head -c 300000 /dev/urandom > body.bin
          { printf '%%PDF-1.7 '; cat body.bin; } > direct.pdf
          size=$(stat -c %s direct.pdf)
          started=$(curl -sf -H "$T" -H "Content-Type: application/json" \
            -d "{\"fileName\":\"direct.pdf\",\"contentType\":\"application/pdf\",\"size\":$size}" \
            "http://localhost:8080/api/v1/files/direct-uploads")
          echo "$started" | jq .
          url=$(echo "$started" | jq -r .url)
          upload=$(echo "$started" | jq -r .uploadId)
          curl -sf -X PUT -H "Content-Type: application/pdf" --data-binary @direct.pdf "$url"
          id=$(curl -sf -H "$T" -X POST "http://localhost:8080/api/v1/files/direct-uploads/$upload/complete" | jq -r .id)
          curl -sf -H "$T" -o direct-back.pdf "http://localhost:8080/api/v1/files/$id/content"
          cmp direct.pdf direct-back.pdf

      - name: The API and the workers share the storage volume and Redis
        run: |
          docker compose exec -T api find /data/file-storage -name '*.pdf' | grep -q .
          docker compose exec -T --index 2 worker find /data/file-storage -name '*.pdf' | grep -q .
          # Both workers scheduled the job; the lock they share (and the rate-limit counts) live in Redis.
          test "$(docker compose ps -q worker | wc -l)" = 2
          test "$(docker compose logs worker | grep -c "Scheduled job 'storage-cleanup'")" -ge 2
          docker compose exec -T redis redis-cli --scan | tee redis-keys.txt
          grep -qi "ratelimit" redis-keys.txt

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
