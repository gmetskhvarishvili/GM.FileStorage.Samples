name: ci

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # A real PostgreSQL so the end-to-end (WAF) tests actually run instead of no-opping. The committed
    # appsettings.json carries no password, so the job supplies the full connection string below.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: GMFileStorageSample
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d GMFileStorageSample"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__ApplicationDatabase: "Host=localhost;Port=5432;Database=GMFileStorageSample;Username=postgres;Password=123456"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal
